# The DEV stack: MinIO + Keycloak + em-server, on a laptop.
#
# NOT a second deployment path. The real server — a local FCN and an
# institutional node are the same service — is provisioned with the Ansible /
# compose of production (heriverse-ansible). What runs here is the SAME
# em-server image, the SAME wire, and the SAME MinIO implementation of the
# AssetStore. This file only puts the two things it depends on next to it, so
# the promotion arc can be exercised against a REAL object store without a
# remote host.
#
#   docker compose --env-file .env.dev -f docker-compose.dev.yml up -d --build
#
# Credentials come from `.env.dev` (copy `.env.dev.example`). They are DEV ONLY:
# the production secrets come from the Ansible defaults / Vault, and nothing in
# this directory is ever a source of them.

name: em-dev

# ── the graph language: ONE version for the whole stack, written ONCE ────────
#
# The three services install s3Dgraphy separately, and their EXTRAS legitimately
# differ (the room server wants [geo,rdf] and pyproj with it; the field assistant
# wants neither and should not ship them to a tablet's node). The VERSION is not
# theirs to choose: they share em.json files and one semantic vocabulary, and the
# day the differences stop being additive the symptom is a study the catalogue
# indexes differently from how the server wrote it — a very long bug to chase.
#
# It was already true. Read out of the build log of 2026-08-30: the room server
# on `==1.6.0.dev12`, the catalogue and the assistant drifted to dev16 behind two
# `>=` specs that moved by themselves at every rebuild.
#
# EXACT, never `>=`. HERE and not in `.env.dev`, which is gitignored — a version
# in a file a fresh clone does not have is a version nobody else has. An anchor
# and not three copies, for the reason this whole change exists. The environment
# may still override it for a deliberate experiment; what it cannot do is drift.
x-s3dgraphy-version: &s3dgraphy_version "${S3DGRAPHY_VERSION:-1.6.0.dev17}"

services:
  # =======================================================================
  # OBJECT STORE — where the assets actually live (content-addressed)
  # =======================================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: em-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      # `127.0.0.1:` DAVANTI. Il nodo di campo, per progetto, FA DA HOTSPOT ai
      # tablet del cantiere: «siamo tutti sulla stessa rete» non e' un
      # incidente, e' la specifica. Una porta su `0.0.0.0` qui e' un servizio
      # raggiungibile da ogni dispositivo attaccato.
      #
      # Loopback significa «solo da questa macchina», NON «da nessuno»: gli
      # smoke, `token.sh`, `seed_rooms.py` e un browser sul Mac continuano a
      # funzionare — misurato prima di legarle, cercando ogni porta in
      # `dev-stack/`, negli `smoke_*.py`, in `.env.dev*` e nel `Caddyfile.dev`.
      # Fra container si parla per nome di servizio sulla rete di compose, e
      # Caddy fa lo stesso: nessuna di queste porte e' sul percorso di un'altra.
      #
      # L'UNICA che resta su `0.0.0.0` e' la 8443 di Caddy, e non e'
      # negoziabile: e' la porta del nodo, ed e' quella da cui passera' la
      # prova a due macchine sulla rete locale.
      #
      # 9001 e' la CONSOLE DI AMMINISTRAZIONE di MinIO, con le credenziali di
      # root in `.env.dev`. Su loopback resta apribile dal browser di questo
      # Mac — `EM_MINIO_CONSOLE_URL` la nomina come `http://localhost:9001`, e
      # `localhost` in un browser e' sempre stata la macchina di chi guarda,
      # quindi per un altro dispositivo non ha mai funzionato e non cambia
      # niente.
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # the readiness endpoint, not a port check: a listening socket is not a
      # store that will accept an object
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    # `unless-stopped` COME TUTTI GLI ALTRI, e fino al 2026-09-19 questa chiave
    # mancava — non era una decisione scritta, era un'assenza. Misurato: il
    # file ha `restart: unless-stopped` su ogni servizio di lunga durata
    # (cantaloupe, caddy, stratigraph-server, chatbot, catalog, nodeodm,
    # couchdb, pyarchinit-mini) e `restart: "no"` UNA volta sola, su
    # `minio-init`, che e' un one-shot e li' e' giusto. Nessun commento, in
    # nessun punto del file o di `fcn-up.sh`, spiegava l'assenza qui.
    #
    # La conseguenza l'ha mostrata un riavvio della VM di Colima: il nodo e'
    # risalito con sei servizi su e sani e SENZA identita' e SENZA object store,
    # che e' la condizione peggiore — sembra accesso e non lo e'.
    #
    # E il rischio di far ripartire Keycloak da solo e' misurato, non sperato:
    # un RESTART riusa il filesystem del container, quindi il database interno
    # di `start-dev` sopravvive, l'import non rigira e le chiavi del realm NON
    # cambiano. E' un RECREATE che le rifa' — ed e' quello che serve dopo una
    # modifica al realm (vedi `keycloak/README.md`).
    restart: unless-stopped

  # A one-shot: create the bucket, then exit. em-server would create it itself
  # (its `_ensure_bucket`), but doing it here means the bucket exists before the
  # first request even if em-server is started with credentials that are not
  # allowed to create buckets — which is what production looks like.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: em-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "${MINIO_BUCKET}"
    entrypoint: >
      /bin/sh -c "
        mc alias set dev http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing dev/$$MINIO_BUCKET &&
        mc ls dev &&
        echo 'bucket ready: '$$MINIO_BUCKET
      "
    restart: "no"

  # =======================================================================
  # IIIF IMAGE API — Cantaloupe, reading straight from the bucket
  # =======================================================================
  #
  # It takes its images from MinIO with the **digest as the identifier**, which
  # is the whole reason this is cheap: the assets are already content-addressed,
  # so no second copy, no import step, no thumbnail pipeline to keep in sync.
  #
  # What it buys, and none of it is code we write: thumbnails (a size request),
  # deep zoom (tiles), region delivery (an annotation's crop, served), and
  # interoperability with every IIIF viewer there is.
  cantaloupe:
    image: islandora/cantaloupe:main
    container_name: em-dev-cantaloupe
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      CANTALOUPE_HTTP_ENABLED: "true"
      CANTALOUPE_HTTP_HOST: "0.0.0.0"
      CANTALOUPE_HTTP_PORT: "8182"
      CANTALOUPE_HTTPS_ENABLED: "false"
      # Image API 3 is what the manifests and the viewers speak; 2 stays on
      # because Mirador and older clients still ask for it.
      CANTALOUPE_ENDPOINT_IIIF_3_ENABLED: "true"
      CANTALOUPE_ENDPOINT_IIIF_2_ENABLED: "true"
      CANTALOUPE_ENDPOINT_IIIF_1_ENABLED: "false"
      CANTALOUPE_ENDPOINT_ADMIN_ENABLED: "false"
      CANTALOUPE_ENDPOINT_API_ENABLED: "false"
      CANTALOUPE_ENDPOINT_HEALTH_ENABLED: "true"
      # --- the source: the SAME bucket em-server writes to -------------------
      CANTALOUPE_SOURCE_STATIC: "S3Source"
      CANTALOUPE_S3SOURCE_ENDPOINT: "http://minio:9000"
      CANTALOUPE_S3SOURCE_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      CANTALOUPE_S3SOURCE_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      CANTALOUPE_S3SOURCE_REGION: "us-east-1"
      CANTALOUPE_S3SOURCE_LOOKUP_STRATEGY: "BasicLookupStrategy"
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_BUCKET_NAME: "${MINIO_BUCKET}"
      # NO path prefix and NO suffix: the IIIF identifier IS the sha256 hex,
      # which is exactly the object's key. One name for one thing.
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: ""
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_PATH_SUFFIX: ""
      # --- processing --------------------------------------------------------
      CANTALOUPE_PROCESSOR_SELECTION_STRATEGY: "AutomaticSelectionStrategy"
      # Derivatives are a CACHE, not data: they can always be recomputed from
      # the asset, so losing them costs time and nothing else.
      #
      # OFF here, and MEASURED rather than assumed: with the filesystem
      # derivative cache on, this image answers 200 with a **zero-byte body**
      # (the log shows `InfoService putInCachesAsync(): /var/cache/cantaloupe/info`
      # and every image comes back empty). A silently empty image is the worst
      # kind of wrong, so the cache stays off until a deployment configures one
      # it can verify.
      CANTALOUPE_CACHE_SERVER_DERIVATIVE_ENABLED: "false"
      CANTALOUPE_CACHE_SERVER_INFO_ENABLED: "false"
      CANTALOUPE_LOG_APPLICATION_LEVEL: "info"
    ports:
      # `127.0.0.1:` DAVANTI. Il nodo di campo, per progetto, FA DA HOTSPOT ai
      # tablet del cantiere: «siamo tutti sulla stessa rete» non e' un
      # incidente, e' la specifica. Una porta su `0.0.0.0` qui e' un servizio
      # raggiungibile da ogni dispositivo attaccato.
      #
      # Loopback significa «solo da questa macchina», NON «da nessuno»: gli
      # smoke, `token.sh`, `seed_rooms.py` e un browser sul Mac continuano a
      # funzionare — misurato prima di legarle, cercando ogni porta in
      # `dev-stack/`, negli `smoke_*.py`, in `.env.dev*` e nel `Caddyfile.dev`.
      # Fra container si parla per nome di servizio sulla rete di compose, e
      # Caddy fa lo stesso: nessuna di queste porte e' sul percorso di un'altra.
      #
      # L'UNICA che resta su `0.0.0.0` e' la 8443 di Caddy, e non e'
      # negoziabile: e' la porta del nodo, ed e' quella da cui passera' la
      # prova a due macchine sulla rete locale.
      #
      # E QUESTA E' LA PIU' IMPORTANTE, perche' non era solo esposta: era una
      # SCORCIATOIA. L'embargo sulle immagini e' applicato da Caddy con
      # `forward_auth` verso `/v1/iiif-authz`, e Cantaloupe legge il bucket per
      # sha256 senza sapere niente di ruoli. Una richiesta su :8182 non passa
      # dal cancello. Chiudere la porta senza spostare `EM_IIIF_PUBLIC` avrebbe
      # rotto le immagini; spostarlo senza chiudere la porta avrebbe lasciato
      # la scorciatoia: le due cose vanno insieme, e sono in questo commit.
      - "127.0.0.1:${CANTALOUPE_PORT:-8182}:8182"
    volumes:
      - cantaloupe_cache:/var/cache/cantaloupe
    restart: unless-stopped


  # =======================================================================
  # HTTPS — the same Caddy, the same routes, as the production deployment
  # =======================================================================
  #
  # Why a proxy on a laptop at all: two end-to-end proofs were blocked not by
  # logic but by `http://localhost`. A hosted IIIF viewer cannot fetch a
  # manifest over plain HTTP from an https page (mixed content), and a token in
  # a query is only defensible behind TLS. So the dev stack grows the same shape
  # the deployment has — one host, TLS terminated, routes by path — and the two
  # stop differing in the one way that mattered.
  #
  # The certificate comes from **Caddy's own internal CA**. Trusting that CA is
  # the one gesture this file cannot make for you: it needs the system keychain
  # and therefore a password (see README-DEV). Without the trust step, curl
  # works with `--cacert` and browsers do not — which is exactly the boundary,
  # and the reason the staging host with a public certificate is the real
  # answer.
  #
  #   docker compose --profile https --env-file .env.dev -f docker-compose.dev.yml up -d
  caddy:
    image: caddy:2-alpine
    container_name: em-dev-caddy
    profiles: ["https"]
    depends_on:
      - stratigraph-server
      - cantaloupe
      - minio
    ports:
      # SU `0.0.0.0`, DELIBERATAMENTE, e l'unica del dev-stack che ci resta.
      # E' la porta del nodo: tutto il resto e' stato legato al loopback il
      # 2026-09-19 perche' il nodo di campo fa da hotspot al cantiere, e questa
      # e' la via da cui passera' la prova a due macchine sulla rete locale.
      # Se qualcuno «uniformasse» anche questa, il nodo diventerebbe
      # irraggiungibile da qualunque altro dispositivo.
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # the internal CA lives here: keep it, or every
      - caddy_config:/config      # restart mints a new root nobody trusts
    environment:
      # EM_SITE = elenco di indirizzi (con schema) che Caddy serve, es.
      # "https://em.localhost, https://mac.local". Hostname, MAI un IP nudo:
      # la CA interna non emette certificati per un IP → handshake TLS fallito.
      EM_SITE: "${EM_SITE:-https://em.localhost}"
      EM_DEV_DOMAIN: "${EM_DEV_DOMAIN:-em.localhost}"
    restart: unless-stopped

  # =======================================================================
  # IDENTITY — the same realm mechanism as production, seeded so a token is a
  # curl away instead of a click-through
  # =======================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: em-dev-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      # ── ONE frontend URL, and that is the whole fix ─────────────────────────
      # MEASURED BUG (2026-08-29, in the field test): the room browser is served
      # over https and `/v1/auth-config` handed it an issuer of
      # `http://localhost:8085`. The PKCE code→token exchange is then a fetch
      # from an https page to an http endpoint — MIXED CONTENT. Safari blocks it
      # outright; Chrome sometimes lets `localhost` through as a secure context,
      # which is worse, because it works on one machine and not the next.
      #
      # The cure is not to patch the one URL the browser sees: it is to give
      # Keycloak a single PUBLIC identity, so the `iss` it stamps is the same
      # string no matter which door a token came through (the proxy on 8443 or
      # the direct port on 8085). `app/auth.py` verifies `iss` strictly against
      # `OIDC_ISSUER`, so two spellings mean 401 for one of them.
      KC_HOSTNAME_URL: "${OIDC_PUBLIC_ORIGIN:-https://em.localhost:${HTTPS_PORT:-8443}}/auth"
      # …and the relative path that makes Caddy's `handle /auth/*` land. `handle`
      # and NOT `handle_path`: the prefix is kept, so Keycloak must expect it.
      # The pair has to agree — with `handle_path` and no relative path it also
      # works, and mixing the two is a 404 that looks like a routing bug.
      KC_HTTP_RELATIVE_PATH: "/auth"
      # Honour Caddy's X-Forwarded-Proto. Without it Keycloak builds its own
      # redirects as http and the round trip breaks in the middle.
      KC_PROXY: "edge"
      # The direct port stays usable (token.sh, the smokes, a developer poking at
      # the admin console) even though the public identity is the https one.
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      # `127.0.0.1:` DAVANTI. Il nodo di campo, per progetto, FA DA HOTSPOT ai
      # tablet del cantiere: «siamo tutti sulla stessa rete» non e' un
      # incidente, e' la specifica. Una porta su `0.0.0.0` qui e' un servizio
      # raggiungibile da ogni dispositivo attaccato.
      #
      # Loopback significa «solo da questa macchina», NON «da nessuno»: gli
      # smoke, `token.sh`, `seed_rooms.py` e un browser sul Mac continuano a
      # funzionare — misurato prima di legarle, cercando ogni porta in
      # `dev-stack/`, negli `smoke_*.py`, in `.env.dev*` e nel `Caddyfile.dev`.
      # Fra container si parla per nome di servizio sulla rete di compose, e
      # Caddy fa lo stesso: nessuna di queste porte e' sul percorso di un'altra.
      #
      # L'UNICA che resta su `0.0.0.0` e' la 8443 di Caddy, e non e'
      # negoziabile: e' la porta del nodo, ed e' quella da cui passera' la
      # prova a due macchine sulla rete locale.
      #
      # `token.sh` usa DI PROPOSITO questa porta diretta (nessun certificato da
      # fidare) e continua a funzionare: gira su questa macchina. Il browser
      # passa da `/auth` su 8443, perche' `KC_HOSTNAME_URL` fissa un solo
      # frontend url.
      - "127.0.0.1:${KEYCLOAK_PORT:-8085}:8080"
    volumes:
      - ./keycloak/realm-em-dev.json:/opt/keycloak/data/import/realm-em-dev.json:ro
    healthcheck:
      # Keycloak 24 has no curl in the image; this is the shell's own /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /auth/realms/em-dev HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | head -1 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 40
    # `unless-stopped` COME TUTTI GLI ALTRI, e fino al 2026-09-19 questa chiave
    # mancava — non era una decisione scritta, era un'assenza. Misurato: il
    # file ha `restart: unless-stopped` su ogni servizio di lunga durata
    # (cantaloupe, caddy, stratigraph-server, chatbot, catalog, nodeodm,
    # couchdb, pyarchinit-mini) e `restart: "no"` UNA volta sola, su
    # `minio-init`, che e' un one-shot e li' e' giusto. Nessun commento, in
    # nessun punto del file o di `fcn-up.sh`, spiegava l'assenza qui.
    #
    # La conseguenza l'ha mostrata un riavvio della VM di Colima: il nodo e'
    # risalito con sei servizi su e sani e SENZA identita' e SENZA object store,
    # che e' la condizione peggiore — sembra accesso e non lo e'.
    #
    # E il rischio di far ripartire Keycloak da solo e' misurato, non sperato:
    # un RESTART riusa il filesystem del container, quindi il database interno
    # di `start-dev` sopravvive, l'import non rigira e le chiavi del realm NON
    # cambiano. E' un RECREATE che le rifa' — ed e' quello che serve dopo una
    # modifica al realm (vedi `keycloak/README.md`).
    restart: unless-stopped

  # =======================================================================
  # THE ROOM — built from em-server's own Dockerfile, unchanged
  # =======================================================================
  stratigraph-server:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # The extras stay in this service's Dockerfile; the version comes from
        # the anchor at the top of this file, and is not a service's to choose.
        S3DGRAPHY_VERSION: *s3dgraphy_version
    image: stratigraph-server:dev
    container_name: em-dev-server
    depends_on:
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # --- identity: the realm this dev stack seeds --------------------------
      # The issuer is what the TOKEN says it is. Inside the compose network
      # Keycloak is `keycloak:8080`, but a token minted through the host port
      # carries `http://localhost:<port>` — so the issuer is the HOST spelling
      # and the JWKS is fetched over the internal one. Getting this pair wrong
      # is the classic "token refused, and both sides look right".
      # The PUBLIC issuer — what `iss` says and what a browser is told to go to.
      # `fcn-up.sh` has exported this all along; the compose used to override it
      # with an http URL, which is how the mixed-content bug survived a launcher
      # that was already right.
      OIDC_ISSUER: "${OIDC_ISSUER:-https://em.localhost:${HTTPS_PORT:-8443}/auth/realms/${DEV_REALM}}"
      # …and the INTERNAL address the keys are fetched from. Different on purpose,
      # and the same split as the IIIF pair below: `iss` is a NAME the token
      # carries, the JWKS URI is a machine we dial. Routing the key fetch through
      # Caddy would make the server's ability to validate depend on its own proxy.
      OIDC_JWKS_URI: "http://keycloak:8080/auth/realms/${DEV_REALM}/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "${DEV_CLIENT_ID}"
      # --- the object store: the PRODUCTION implementation -------------------
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "${MINIO_BUCKET}"
      MINIO_SECURE: "false"
      # --- room documents ----------------------------------------------------
      EM_SNAPSHOT_DIR: "/srv/em-data/snapshots"
      # --- the resident DTC corpus ------------------------------------------
      # The register rides in the MinIO bucket above (no setting needed for that).
      # What DOES need saying is who may read the WHOLE of it: the lot is the
      # provenance of every study on the instance, so it is a CURATION read and
      # off by default. Here the dev user is the curator, which is what lets
      # `smoke_corpus_resident.py` measure the whole read as well as the slice.
      EM_CORPUS_CURATORS: "${DEV_CURATOR_ORCID:-0000-0002-1825-0097}"
      # …and who looks after the NODE, which is a different job from owning a
      # room in it: the node console (`/admin`) and the cross-room API are behind
      # this capability, and an owner cannot grant it to themselves (there is no
      # endpoint that can). Same shape as the curator list above, and the same
      # default identity, so a laptop stack has one of each without a realm edit.
      # In a real deployment prefer the realm role: EM_OPERATOR_ROLE (default
      # `em-operator`), granted in Keycloak by whoever administers the realm.
      EM_OPERATORS: "${DEV_OPERATOR_ORCID:-0000-0002-1825-0097}"
      # --- images · the URL topology (docs/URL-TOPOLOGY.md) --------------------
      # PUBLIC: what goes into a manifest. Other people's viewers fetch it, so it
      # must name a host they can reach — `localhost` here, the proxy's name in
      # production.
      # L'indirizzo che finisce DENTRO I MANIFEST che questo nodo consegna, e
      # che i visualizzatori di altri vanno a chiedere. Fino al 2026-09-19 era
      # `http://localhost:${CANTALOUPE_PORT}/iiif/3`, cioe' la porta diretta di
      # Cantaloupe — la via che NON passa dal `forward_auth` dell'embargo.
      # Misurato su un manifest vero (`/rooms/mostra/iiif/img-1/manifest`):
      # conteneva `http://localhost:8182/iiif/3/<sha256>/full/!400,400/0/`.
      #
      # Cioe' il nodo diceva al mondo di usare la scorciatoia. Ora nomina la
      # porta di casa, e l'embargo e' sul percorso di ogni pixel.
      #
      # E `localhost` era sbagliato due volte: in un manifest consegnato a un
      # altro, `localhost` e' la macchina di chi legge.
      EM_IIIF_PUBLIC: "https://em.localhost:${HTTPS_PORT:-8443}/iiif/3"
      # INTERNAL: how em-server itself dials the image server, to read info.json
      # and learn each image's real size. NOT the same address — inside this
      # network `localhost` is em-server. Using the public form here measures
      # nothing and every canvas silently gets a placeholder size.
      EM_IIIF_INTERNAL: "http://cantaloupe:8182/iiif/3"
      # --- who else this node watches (the Node Health panel) ------------------
      # em-catalog runs in this stack, so the health panel can report on it. An
      # INTERNAL address again, for the same reason. Unset on a node with no
      # Catalog: the panel then says «not configured», which is a fact about the
      # deployment and not a failure.
      EM_CATALOG_INTERNAL: "http://stratigraph-catalog:8000"
      # …and the field assistant, which runs here too. Same rule as the Catalog:
      # a service BESIDE this one, watched only because a deployment named it.
      EM_CHATBOT_INTERNAL: "http://stratigraph-chatbot:8000"
      # --- and where a BROWSER should go for each of them ----------------------
      # The internal addresses above are machines we dial; these are names we
      # hand out, and `/v1/node` publishes them so the entrance page can compose
      # this node's faces WITHOUT carrying a list of paths in its own source —
      # which would be a fifth place to keep aligned. Unset on a deployment that
      # does not publish that face: the page then shows it with no link, rather
      # than with a guessed one.
      EM_CATALOG_PUBLIC: "${EM_CATALOG_PUBLIC:-https://em.localhost:${HTTPS_PORT:-8443}/catalog}"
      # --- this node's own PUBLIC address, for handoff links -------------------
      # What `stratigraph://open?server=…` names. Behind Caddy the server lives
      # under /em, and the link has to say so or the tool that follows it dials a
      # path that is not there.
      EM_PUBLIC_BASE: "${EM_PUBLIC_BASE:-https://em.localhost:${HTTPS_PORT:-8443}/em}"
      # --- where the tools' WEB builds live ------------------------------------
      # Set one and the room browser offers "browser" beside "desktop" for that
      # tool: a plain tab at `<web>?server=&room=`, no token, the app signs
      # itself in. Unset and that tool has only the desktop scheme — no button,
      # rather than a button that 404s.
      #
      # EMStudio's default is now THIS ORIGIN's own route — `/em/studio`, served
      # by Caddy above — and that is a correction rather than a convenience. It
      # was left empty (and then set to `http://localhost:5173` in somebody's
      # `.env.dev`), so a room's «open in browser» sent EMStudio to a DIFFERENT
      # ORIGIN: a page that then cannot fetch a study container from the
      # catalogue, which is the whole reason `/em/studio/` exists. The Catalog was
      # already pointed at `/em/studio` and the room server was not — one
      # deployment, two answers.
      #
      # Root-relative on purpose: the room browser opens it with `window.open`,
      # which resolves it against the page's own origin, so the same value is
      # right whether this stack is reached on `em.localhost:8443` or on a
      # colleague's hostname. `.env.dev` still overrides it — and E.D.'s copy is
      # his to change.
      EM_EMSTUDIO_WEB_URL: "${EM_EMSTUDIO_WEB_URL:-/em/studio}"
      # --- the NODE MAP's browser addresses ------------------------------------
      # HERE they are real and known, which is exactly why they are set here and
      # empty in the production template: on this stack Keycloak's console and
      # MinIO's console are published on the same origin as everything else, and
      # an operator opening the map wants to click through to them. On somebody
      # else's host neither is a given — see `heriverse-ansible`.
      EM_KEYCLOAK_CONSOLE_URL: "https://em.localhost:${HTTPS_PORT:-8443}/auth/admin/"
      EM_MINIO_CONSOLE_URL: "http://localhost:${MINIO_CONSOLE_PORT:-9001}"
      # …but the field assistant is NOT one of those: it is a container in this
      # stack, up whenever the stack is, served by Caddy at /chat/. The reason
      # for the empty default above does not apply to it, and leaving it empty
      # cost a door that works and a public address `/v1/node` could publish.
      EM_FIELD_ASSISTANT_URL: "${EM_FIELD_ASSISTANT_URL:-https://em.localhost:${HTTPS_PORT:-8443}/chat/}"
      # --- the photogrammetric engine ----------------------------------------
      # An ENDPOINT, not a host: today the `nodeodm` service beside us, tomorrow
      # a ClusterODM broker in front of a CPU worker and a GPU one — the same
      # three REST endpoints either way, which is why no code changes for that.
      # Unset on a node with no engine: `/v1/photogrammetry` then answers 503
      # saying so, rather than timing out against nothing.
      # --- the photogrammetric engine: OFF unless you say otherwise -----------
      #
      # `NODEODM_URL` used to be set unconditionally while the engine itself is
      # `--profile engine`, so a plain run showed the map a configured address
      # that nobody was listening on: `unreachable`, with the neighbour's DNS
      # error. An engine off BY CHOICE looking exactly like a broken one — which
      # sends somebody hunting a fault that is not there.
      #
      # So the deployment says which it is, and the node has three answers
      # instead of two (`app/node_health.py`: OFF · ABSENT · the probe's).
      # `NODEODM_START_HINT` is the sentence the row carries when it is off: the
      # node names what it knows, and the deployment — which is the only thing
      # that knows whether this is a compose profile or an Ansible flag —
      # supplies the words.
      NODEODM_ENABLED: "${NODEODM_ENABLED:-false}"
      NODEODM_URL: "${NODEODM_URL:-http://nodeodm:3000}"
      NODEODM_START_HINT: "${NODEODM_START_HINT:-the engine is off in this stack (2.62 GB image). One command brings it up and tells the server: NODEODM_ENABLED=true docker-compose --env-file .env.dev -f docker-compose.dev.yml --profile engine up -d nodeodm stratigraph-server}"
      # The dev stack runs the LIBRARY YOU ARE EDITING: the sibling s3Dgraphy
      # checkout is mounted and put first on the path. If it is not there the
      # mount is an empty directory and the image's pinned wheel is used instead
      # — so this is a convenience, never a requirement.
      PYTHONPATH: "/srv/s3dgraphy-src"
    ports:
      # `127.0.0.1:` DAVANTI. Il nodo di campo, per progetto, FA DA HOTSPOT ai
      # tablet del cantiere: «siamo tutti sulla stessa rete» non e' un
      # incidente, e' la specifica. Una porta su `0.0.0.0` qui e' un servizio
      # raggiungibile da ogni dispositivo attaccato.
      #
      # Loopback significa «solo da questa macchina», NON «da nessuno»: gli
      # smoke, `token.sh`, `seed_rooms.py` e un browser sul Mac continuano a
      # funzionare — misurato prima di legarle, cercando ogni porta in
      # `dev-stack/`, negli `smoke_*.py`, in `.env.dev*` e nel `Caddyfile.dev`.
      # Fra container si parla per nome di servizio sulla rete di compose, e
      # Caddy fa lo stesso: nessuna di queste porte e' sul percorso di un'altra.
      #
      # L'UNICA che resta su `0.0.0.0` e' la 8443 di Caddy, e non e'
      # negoziabile: e' la porta del nodo, ed e' quella da cui passera' la
      # prova a due macchine sulla rete locale.
      #
      # `smoke_corpus_resident.py` ha `http://localhost:8000/v1` come default e
      # `seed_rooms.py` la nomina nel suo docstring: entrambi girano qui.
      - "127.0.0.1:${EM_SERVER_PORT:-8000}:8000"
    volumes:
      - em_data:/srv/em-data
      # The dev stack runs the CODE YOU ARE EDITING, on both sides of the line:
      # em-server's own app and the sibling s3Dgraphy checkout. Without the first
      # one, an edit to a route is invisible until the image is rebuilt — which
      # is discovered as a 404 on an endpoint that plainly exists.
      - ../app:/srv/em-server/app:ro
      - ../../s3Dgraphy/src:/srv/s3dgraphy-src:ro
    restart: unless-stopped

  # =======================================================================
  # THE FIELD ASSISTANT — behind the same https door as everything else
  #
  # WHY IT IS IN THE STACK AT ALL, and it is not tidiness: it used to run by hand
  # on `:8020`, in the clear. On a laptop that is fine — `localhost` is a secure
  # context — but on a PHONE it is not, and a browser withholds the camera, the
  # microphone and the GPS from an insecure origin. Which is everything a field
  # assistant exists for. Behind Caddy, on the shared https origin, they come
  # back. It is also half of the deployment (#37): the shape taken here is the
  # shape that goes on the real node.
  #
  # NO ROOM BY DEFAULT, and that is the honest case rather than a shortcut. The
  # assistant refuses to start with a room configured and no token (`writer.py`:
  # "the assistant writes as a verified person or it does not write"), and a
  # compose file cannot call `token.sh`. Pasting a JWT into `.env.dev` would
  # dress a credential up as configuration and leave it there. So the stack's
  # default is the local container the README already describes; pointing it at
  # a room with a fresh token is two lines in CHEATSHEET.md.
  # =======================================================================
  stratigraph-chatbot:
    build:
      context: ../../stratigraph-chatbot
      dockerfile: Dockerfile
      args:
        # The extras stay in this service's Dockerfile; the version comes from
        # the anchor at the top of this file, and is not a service's to choose.
        S3DGRAPHY_VERSION: *s3dgraphy_version
    image: stratigraph-chatbot:dev
    container_name: em-dev-chatbot
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # --- identity: WHO IS DICTATING, and the reason this is not optional ----
      # No ingestion without an author. The assistant refuses to write without a
      # verified identity (`contract.py`), so a node with no provider is a node
      # whose field page can only show a gate — correct, and useless. The same
      # three variables the room server reads, from the SAME sources, because
      # two spellings of one realm is how one of them ends up wrong.
      OIDC_ISSUER: "${OIDC_ISSUER:-https://em.localhost:${HTTPS_PORT:-8443}/auth/realms/${DEV_REALM}}"
      # The internal address the keys come from — `iss` is a NAME the token
      # carries, the JWKS URI is a machine we dial. Same split as the server's.
      OIDC_JWKS_URI: "http://keycloak:8080/auth/realms/${DEV_REALM}/protocol/openid-connect/certs"
      # …and NOT `${DEV_CLIENT_ID}`, which is the room server's name. This
      # service checks its OWN: the realm's `em-console` carries two audience
      # mappers, `em-server` and `em-chatbot`, so ONE token minted by the field
      # page satisfies the assistant here and the room next door. Requiring
      # `em-server` instead would have made this service accept anything minted
      # for the stack, which is not the question `auth.py` says it answers.
      OIDC_AUDIENCE: "em-chatbot"
      # The PUBLIC browser client the field page signs in as. `em-console` is the
      # one this stack already has: the realm enforces PKCE S256 on it and it
      # carries the mappers above. A second public client would duplicate both.
      EM_CHATBOT_CLIENT_ID: "${EM_CHATBOT_CLIENT_ID:-em-console}"
      # --- the object store: the SAME variables the server reads --------------
      # Reused rather than paralleled: two spellings of one bucket is how one of
      # them ends up pointing somewhere else.
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "${MINIO_BUCKET}"
      MINIO_SECURE: "false"
      # --- where what is said ends up ----------------------------------------
      # A container on a volume, not a room: see the note above. The path is
      # under the data volume so a node that loses power keeps what was recorded.
      EM_CHATBOT_CONTAINER: "/srv/chatbot-data/scavo.em.json"
      EM_CHATBOT_STUDY: "${EM_CHATBOT_STUDY:-Scavo}"
      # …and the room, EMPTY unless you fill both of these in `.env.dev`. With a
      # room and no token the service refuses to start, which is correct and is
      # why neither has a default here.
      EM_SERVER_URL: "${EM_CHATBOT_SERVER_URL:-}"
      EM_CHATBOT_ROOM: "${EM_CHATBOT_ROOM:-}"
      EM_CHATBOT_TOKEN: "${EM_CHATBOT_TOKEN:-}"
    volumes:
      # A field node is switched off by pulling the plug. What was recorded has
      # to survive that.
      - chatbot_data:/srv/chatbot-data
      # …and the CODE you are editing, like the other two services: without it a
      # change to the page is invisible until the image is rebuilt.
      - ../../stratigraph-chatbot/app:/srv/stratigraph-chatbot/app:ro
      - ../../stratigraph-chatbot/web:/srv/stratigraph-chatbot/web:ro
    restart: unless-stopped

  # =======================================================================
  # THE ENGINE — NodeODM, the photogrammetric reconstruction
  #
  # A PULLED DEPENDENCY, not our code (design §7-bis): the processing connector
  # in s3Dgraphy drives it over three REST endpoints, and the only bespoke part
  # is that connector. It is here for the same reason MinIO and Cantaloupe are —
  # a service of the node, brought up with it.
  #
  # PINNED, never `latest`. 3.5.6 is the newest semver tag published for BOTH
  # amd64 and arm64 (checked on the registry, 2026-08-29), so it runs natively on
  # an Apple-Silicon Mac mini with no emulation. Updating is deliberate: raise the
  # tag, `docker compose pull nodeodm && docker compose up -d nodeodm`, one
  # service at a time. `latest` moved on 2026-03-25 and would have moved under a
  # running node without anybody choosing it.
  #
  # NOT exposed through Caddy. The engine speaks no auth of its own, so the only
  # thing that may reach it is StratiGraph Server on the compose network; the host
  # port below is for a developer looking at its own dashboard, and it is NOT the
  # address the server uses.
  #
  # MIT, which is why it is the default (design §4): the node is deployed at
  # partners and must stay redistributable.
  # =======================================================================
  # DISK, MEASURED 2026-08-29 — both halves are now handled below, and this is
  # the record of why. The image is 2.62 GB on disk (0.65 GB pulled) and the
  # engine's working area grew by a GB or two per run while keeping FAILED tasks
  # for 48 h by default. On the laptop this was built on (Colima, 19 GB root,
  # ~16 GB of other projects' images) the stack and the engine did not both fit:
  # the pull, and then the server's own rebuild, died on ENOSPC.
  #   · the SIZE is now opt-in       → `profiles: ["engine"]`
  #   · the GROWTH is now bounded    → `--cleanup_tasks_after`
  # If a node still runs out of room, grow the VM rather than shrinking the
  # window: `colima stop && colima start --disk 120` keeps the volumes.
  nodeodm:
    # OPT-IN, like production (`nodeodm_enabled: false` in the Ansible role). A
    # plain `./fcn-up.sh` does NOT bring the engine up; a photogrammetry session
    # does:
    #
    #   docker compose --env-file .env.dev -f docker-compose.dev.yml \
    #     --profile engine up -d nodeodm
    #
    # Measured, and the reason this is a profile rather than a default: the image
    # is 2.62 GB on disk and this laptop's Colima VM has a 19 GB root already
    # holding ~16 GB of other projects — the stack and the engine did not both
    # fit, and the server's own rebuild died on ENOSPC. An engine nobody asked
    # for should not be able to stop the stack from coming up.
    profiles: ["engine"]
    image: opendronemap/nodeodm:3.5.6
    container_name: em-dev-nodeodm
    # THE ROOT CAUSE OF THE DISK, fixed where it starts. Verified against the
    # source of the pinned version (NodeODM v2.2.3 — what `GET /info` reports
    # inside `opendronemap/nodeodm:3.5.6`): `config.js` declares
    # `--cleanup_tasks_after <minutes>` (default 2880 = 48 h) and
    # `--cleanup_uploads_after <minutes>` (same default), and
    # `TaskManager.removeOldTasks` sweeps tasks in FAILED, COMPLETED *and*
    # CANCELED — at boot and then hourly (`0 * * * *`). FAILED matters: the run
    # that filled the disk here was a failure, and 48 h of those is what a node
    # reconstructing every day accumulates.
    #
    # THE TRADE-OFF, said out loud: after this window the engine deletes the
    # task, so its `all.zip` is gone and `GET /task/{uuid}/info` 404s. That is
    # safe for US because the connector downloads the archive and publishes it to
    # MinIO *before* it writes anything to the graph — the bytes we keep are the
    # ones in the object store, not the ones on the engine. What it does cost is
    # re-downloading a run from NodeODM's own dashboard an hour later. Raise
    # NODEODM_CLEANUP_AFTER on a node where somebody works that way.
    command:
      - "--cleanup_tasks_after"
      - "${NODEODM_CLEANUP_AFTER:-60}"
      # the other way the volume grows: a cluster whose upload was interrupted.
      # Its own knob, because the honest value is "the longest a dataset takes to
      # upload", which is a different question from how long to keep results.
      - "--cleanup_uploads_after"
      - "${NODEODM_CLEANUP_UPLOADS_AFTER:-60}"
    ports:
      # 3000 is a crowded port on a laptop; the CONTAINER's is what matters and
      # that one is fixed at 3000 by the image.
      # `127.0.0.1:` come le altre. Non era nell'elenco del 2026-09-19 solo
      # perche' il profilo `engine` e' spento e `docker port` non la mostrava —
      # ma la regola era «tutto tranne 8443», e il giorno che qualcuno accende
      # il motore fotogrammetrico questa porta si aprirebbe sull'hotspot del
      # cantiere. NodeODM non ha autenticazione: chi la raggiunge accoda un
      # lavoro di ricostruzione.
      - "127.0.0.1:${NODEODM_PORT:-3010}:3000"
    volumes:
      # the engine's own working area: tasks, intermediate products, the archives
      # it serves back. A named volume, so a restart does not lose a run that is
      # still inside the cleanup window.
      - nodeodm_data:/var/www/data
    restart: unless-stopped

  # =======================================================================
  # THE CATALOG — studies (em.json containers) beside the rooms
  #
  # A separate service on purpose: em-server serves the ROOM (the graph being
  # edited right now), em-catalog serves the STUDY (the container as published).
  # They share the object store — one bucket, two prefixes — and the same realm,
  # which is what makes "the study you catalogued is the study you edit" true in
  # configuration and not only in prose.
  #
  # It is a REFERENCE implementation (see em-catalog/README.md): the production
  # Catalog is 3DR's, on WP6's CouchDB. This one proves the contract runs.
  # =======================================================================
  stratigraph-catalog:
    build:
      context: ../../stratigraph-catalog
      dockerfile: Dockerfile
      args:
        # The extras stay in this service's Dockerfile; the version comes from
        # the anchor at the top of this file, and is not a service's to choose.
        S3DGRAPHY_VERSION: *s3dgraphy_version
    image: stratigraph-catalog:dev
    container_name: em-dev-catalog
    depends_on:
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # --- identity: the SAME realm as em-server, and the same two variables --
      # The PUBLIC issuer — what `iss` says and what a browser is told to go to.
      # `fcn-up.sh` has exported this all along; the compose used to override it
      # with an http URL, which is how the mixed-content bug survived a launcher
      # that was already right.
      OIDC_ISSUER: "${OIDC_ISSUER:-https://em.localhost:${HTTPS_PORT:-8443}/auth/realms/${DEV_REALM}}"
      # …and the INTERNAL address the keys are fetched from. Different on purpose,
      # and the same split as the IIIF pair below: `iss` is a NAME the token
      # carries, the JWKS URI is a machine we dial. Routing the key fetch through
      # Caddy would make the server's ability to validate depend on its own proxy.
      OIDC_JWKS_URI: "http://keycloak:8080/auth/realms/${DEV_REALM}/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "${DEV_CLIENT_ID}"
      # --- the studies: the SAME bucket as the assets, under `studies/` -------
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "${MINIO_BUCKET}"
      # (no MINIO_SECURE: the scheme of the endpoint decides — `http://` means
      # somebody chose plain. One fact, one place.)
      # --- the library you are editing, first on the path --------------------
      PYTHONPATH: "/srv/s3dgraphy-src"
      # --- the index: DERIVED, so a volume is a convenience, not a safety net.
      # Losing this file costs one POST /catalog/reindex.
      EM_CATALOG_DB: "/srv/em-catalog-data/index.sqlite"
      # Uncomment (and the `couchdb` service below) to exercise the DEPLOY index
      # instead. It is chosen by being configured — never silently.
      # COUCHDB_URL: "http://couchdb:5984"
      # COUCHDB_USER: "${COUCHDB_USER:-admin}"
      # COUCHDB_PASSWORD: "${COUCHDB_PASSWORD:-admin}"
      # --- what to write into an "open in" answer ----------------------------
      #
      # `EM_CATALOG_PUBLIC_URL` is GONE, and its absence is the fix. It said
      # `http://localhost:8010`, which is one origin — so every study opened
      # through https on `em.localhost` handed out a container URL the browser
      # refused as mixed content. Measured in Chrome on 4 September: «Study
      # unreachable — TypeError: Failed to fetch», on a study that was fine.
      #
      # StratiGraph Catalog derives the address FROM THE REQUEST
      # (`app/main.py::_container_url`), which is right by definition — a caller
      # arriving on https gets an https link, one arriving on :8010 gets that
      # one. The two flags that make it true are in the Catalog's Dockerfile
      # (`--proxy-headers --forwarded-allow-ips *`): without them Starlette sees
      # the internal request and the derivation is wrong in a different way. The
      # env var stays available as an override for a proxy that does not
      # forward; it is not how a correct deployment gets a correct answer.
      EM_CATALOG_EMSTUDIO_URL: "${EM_CATALOG_EMSTUDIO_URL:-/em/studio}"
      # --- the reading page: a DIRECTORY, mounted just below -----------------
      # The reader is no longer one self-contained file (that tax is what made
      # its 3D engine +800 kB of inlined base64), so em-catalog serves the whole
      # `dist/` — shell plus `assets/`. Point it at the mount, not at a file.
      # Missing dist → an honest 501 on /study/{id}/narrative, nothing else
      # breaks.
      EM_CATALOG_READER: "/srv/em-reader-dist"
    ports:
      # `127.0.0.1:` DAVANTI. Il nodo di campo, per progetto, FA DA HOTSPOT ai
      # tablet del cantiere: «siamo tutti sulla stessa rete» non e' un
      # incidente, e' la specifica. Una porta su `0.0.0.0` qui e' un servizio
      # raggiungibile da ogni dispositivo attaccato.
      #
      # Loopback significa «solo da questa macchina», NON «da nessuno»: gli
      # smoke, `token.sh`, `seed_rooms.py` e un browser sul Mac continuano a
      # funzionare — misurato prima di legarle, cercando ogni porta in
      # `dev-stack/`, negli `smoke_*.py`, in `.env.dev*` e nel `Caddyfile.dev`.
      # Fra container si parla per nome di servizio sulla rete di compose, e
      # Caddy fa lo stesso: nessuna di queste porte e' sul percorso di un'altra.
      #
      # L'UNICA che resta su `0.0.0.0` e' la 8443 di Caddy, e non e'
      # negoziabile: e' la porta del nodo, ed e' quella da cui passera' la
      # prova a due macchine sulla rete locale.
      #
      # Dietro Caddy c'e' `/catalog/`; questa porta serviva al debug e nessuno
      # script la nomina — misurato.
      - "127.0.0.1:${EM_CATALOG_PORT:-8010}:8000"
    volumes:
      - em_catalog_data:/srv/em-catalog-data
      # the code you are editing, on both sides of the line — same reason as
      # em-server: an edit to a route must not need an image rebuild
      - ../../stratigraph-catalog/app:/srv/em-catalog/app:ro
      - ../../s3Dgraphy/src:/srv/s3dgraphy-src:ro
      # …and the built reader, the same way: `npm run build:reader` in EMStudio
      # is served on the next request, with no rebuild and no restart, because
      # the files are stat'd per request rather than read once at startup.
      - ../../EMStudio/frontend/dist:/srv/em-reader-dist:ro
    restart: unless-stopped

  # =======================================================================
  # pyarchinit-mini — lo scavo che entra dalla porta dei dati
  # =======================================================================
  #
  # Fork `StratiGraph-ECCCH/pyarchinit-mini` (upstream `enzococca/pyarchinit-mini`,
  # GPL-2.0), branch `stratigraph/01-container`. Costruito dal CHECKOUT, come
  # stratigraph-server e stratigraph-catalog: in produzione l'Ansible tira
  # un'immagine dal registry di 3DR, qui non esiste ancora un'immagine da tirare.
  #
  # PRIMO INNESTO, e va detto cosa NON fa ancora: non conosce le stanze, non
  # valida un token di Keycloak, non parla s3Dgraphy con nessuno. Autentica con
  # la sua tabella utenti Flask-Login e scrive nelle sue tabelle. Sta nella stack
  # perche' lo si possa guardare girare accanto agli altri, non perche' sia gia'
  # seduto al tavolo. Le tre cose che gli mancano hanno gia' un ordine:
  # identita' OIDC+ORCID, adapter em.json, client-stanza come modulo.
  pyarchinit-mini:
    build:
      context: ../../pyarchinit-mini
      dockerfile: Dockerfile
      args:
        # Come per gli altri: gli extra sono affare del servizio, la VERSIONE no.
        # Viene dall'ancora in testa a questo file, e il build RIFIUTA senza.
        S3DGRAPHY_VERSION: *s3dgraphy_version
    image: pyarchinit-mini:dev
    container_name: em-dev-pyarchinit
    environment:
      # La chiave Fernet con cui cifra le impostazioni. Valore da laptop: sarebbe
      # una vulnerabilita' su qualsiasi cosa raggiungibile, come tutto in .env.dev.
      PYARCHINIT_SECRET_KEY: "${PYARCHINIT_SECRET_KEY:-dev-not-a-secret-change-me}"
      # DATABASE_URL NON impostata di proposito: l'app cade sul suo default
      # sqlite dentro PYARCHINIT_HOME, cioe' dentro il volume qui sotto. Il ramo
      # Postgres esiste e funziona (database/connection.py), e si accende
      # scrivendo questa variabile — mai per caso.
      # DATABASE_URL: "postgresql://…"
      #
      # --- identita': lo STESSO realm degli altri, ma NON le stesse variabili --
      # Le tre insieme o nessuna: `create_app()` chiama
      # `oidc_routes.configuration_error()` prima di aprire un database e
      # RIFIUTA di partire se una manca, invece di servire pagine con
      # l'autenticazione a meta'. Nessuna variabile = pyarchinit-mini come e'
      # sempre stato, che e' il modo in cui gira su Railway.
      #
      # L'issuer PUBBLICO — cio' che dice `iss` e il posto dove il BROWSER viene
      # mandato. Stessa riga di stratigraph-catalog, per lo stesso motivo: due
      # grafie del realm sono due `iss`, e una delle due viene rifiutata.
      OIDC_ISSUER: "${OIDC_ISSUER:-https://em.localhost:${HTTPS_PORT:-8443}/auth/realms/${DEV_REALM}}"
      # …e l'indirizzo INTERNO da cui si prendono le chiavi. Diverso di proposito:
      # `iss` e' un NOME che il token porta, il JWKS e' una macchina che si
      # chiama. Far passare la lettura delle chiavi da Caddy legherebbe la
      # capacita' di VALIDARE al proprio stesso proxy.
      #
      # Qui questa variabile fa DUE cose in piu' che negli altri servizi, e vanno
      # dette: pyarchinit-mini non valida soltanto, SCAMBIA il codice e poi
      # interroga /userinfo. `OidcSettings` deriva da QUESTA base sia il token
      # endpoint sia quello di userinfo, non dall'issuer, perche' sono le altre
      # due chiamate server-a-server dello stesso giro.
      OIDC_JWKS_URI: "http://keycloak:8080/auth/realms/${DEV_REALM}/protocol/openid-connect/certs"
      # Il client con cui il BROWSER fa il giro. Questa e' l'unica variabile che
      # gli altri servizi non hanno: loro validano un token che qualcun altro ha
      # ottenuto, questo lo ottiene, quindi deve dire chi e'. `em-console` — il
      # client pubblico che le altre pagine usano gia', a cui il 2026-09-12 sono
      # stati aggiunti i due redirect URI di 8090 (e non i due dietro Caddy, che
      # sarebbero una porta che nessuno ha costruito: vedi il README del realm).
      OIDC_CLIENT_ID: "em-console"
      #
      # --- e la porta di casa: c'e' un proxy davanti -------------------------
      # Caddy serve questo servizio sotto `/pyarchinit/` con `handle_path`, che
      # SPOGLIA il prefisso, e lo restituisce in `X-Forwarded-Prefix`. Questa
      # variabile e' cio' che autorizza l'applicazione a CREDERGLI: senza,
      # `ProxyFix` resta spento e quelle intestazioni sono cio' che dice il
      # chiamante, non cio' che dice il proxy — e chi espone pyarchinit-mini
      # direttamente (cioe' quasi tutti) non deve regalare a un client la
      # facolta' di dichiarare il proprio host e il proprio prefisso.
      #
      # Accesa QUI e in nessun altro posto. Sulla porta diretta 8090 non passa
      # da Caddy, ma il prefisso semplicemente non arriva e l'app serve alla
      # radice: le due vie convivono, ed e' misurato.
      PYARCHINIT_BEHIND_PROXY: "1"
      #
      # E `OIDC_AUDIENCE` NON C'E', a differenza di ogni altro servizio qui:
      # nessuno la legge. Il primo accesso vero ha rifiutato un token
      # perfettamente buono con «Invalid audience», e la misura nel realm dice
      # perche': il mapper `audience` scrive `em-server` nell'ACCESS token con
      # `id.token.claim = false`. E non e' una mancanza del realm — l'`aud` di
      # un id_token E' il client che l'ha chiesto (OpenID Connect Core), mentre
      # `em-server` e' l'audience dell'access token che un resource server
      # valida. stratigraph-server e' quel resource server e ha ragione a
      # pretendere `em-server`; questo qui e' un CLIENT che legge il proprio
      # id_token, quindi l'audience su cui insiste e' il suo `client_id`.
      # Tornera', con un lettore vero, quando pyarchinit-mini entrera' in una
      # stanza e terra' un access token.
    ports:
      # 8080 e' occupata su questa macchina (Moodle, e un tunnel ssh), 8085 e'
      # Keycloak: l'host prende 8090, il container resta sulla sua 8080.
      #
      # `127.0.0.1:` DAVANTI, e non e' pignoleria. Senza, Docker pubblica su
      # `0.0.0.0` — misurato il 2026-09-18: da `192.168.1.234:8090` l'app
      # rispondeva 302, e con `X-Forwarded-Prefix: /pwned` rispondeva
      # `Location: /pwned/auth/login?next=%2Fpwned%2F`, cioe' credeva al
      # chiamante. Il residuo era gia' dichiarato nell'end-of della porta di
      # casa («la variabile protegge chi non ha un proxy, non chi ha un proxy E
      # una porta pubblicata») e valutato accettabile «su un portatile».
      #
      # IL CONTESTO VERO NON E' UN PORTATILE. Il Field Computing Node, per
      # progetto, FA DA HOTSPOT ai tablet del cantiere: e' il deployment in cui
      # «siamo tutti sulla stessa rete» non e' un incidente ma la specifica.
      # Una porta su `0.0.0.0` con ProxyFix che si fida delle intestazioni, li',
      # e' raggiungibile da ogni dispositivo attaccato — e chi la raggiunge
      # decide il prefisso e l'host con cui l'applicazione costruisce i propri
      # link.
      #
      # Legata al loopback la seconda porta RESTA, quindi regge ancora
      # l'argomento che ha deciso la forma del `redirect_uri` di OIDC: due
      # porte, due indirizzi giusti, e nessuna base pubblica dichiarata che
      # possa essere giusta per una sola.
      #
      # A chi fra sei mesi volesse riaprirla «per comodita'»: la comodita' e'
      # `ssh -L 8090:127.0.0.1:8090`, che costa una riga e non mette una porta
      # di scrittura sull'hotspot di un cantiere.
      - "127.0.0.1:${PYARCHINIT_PORT:-8090}:8080"
    volumes:
      # TUTTO lo stato dell'app: sqlite, secret.key, media, backup, coda di sync.
      # La directory e' creata NELL'IMMAGINE con l'owner giusto — senza, il volume
      # nasce root-owned e il processo non-root non scrive il primo file.
      - pyarchinit_data:/srv/pyarchinit-data
    restart: unless-stopped

  # The DEPLOY index, for the runs that want to exercise it. Off by default:
  # the dev index is SQLite and needs nothing, and a CouchDB nobody asked for
  # would be a container running for a code path this stack does not take.
  #
  #   docker-compose --env-file .env.dev -f docker-compose.dev.yml --profile couchdb up -d
  couchdb:
    image: couchdb:3
    container_name: em-dev-couchdb
    profiles: ["couchdb"]
    environment:
      COUCHDB_USER: "${COUCHDB_USER:-admin}"
      COUCHDB_PASSWORD: "${COUCHDB_PASSWORD:-admin}"
    ports:
      # `127.0.0.1:` come le altre, e per la stessa ragione di `nodeodm`:
      # fuori dall'elenco solo perche' il profilo `couchdb` e' spento. E' un
      # database con le credenziali in `.env.dev`; e' anche una delle due voci
      # segnalate nell'end-of di ieri sul template di produzione, dove invece
      # e' pubblicata per davvero.
      - "127.0.0.1:${COUCHDB_PORT:-5984}:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pyarchinit_data:   # sqlite, secret.key, media, backup — dati di scavo, non derivati
  em_catalog_data:   # the SQLite index — derivable, so losing it costs a reindex
  couchdb_data:
  caddy_data:      # the internal CA + issued certs — losing it means re-trusting
  caddy_config:
  minio_data:
  em_data:
  cantaloupe_cache:   # derivatives: a cache, recomputable — not study data
  nodeodm_data:       # the engine's tasks and the archives it still serves
  chatbot_data:       # what the field assistant recorded — study data
