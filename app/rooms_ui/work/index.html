<!doctype html>
<!--
  LAVORARE — the rooms of this node.

  One of the four verbs the front door used to do all at once (design note
  `EM_design_aprire-entrare-creare.md`, 6 September 2026). Entering a room does
  NOT take the file away: a room IS the live copy, and «export a copy» is a
  separate verb with its own sentence.

  IT OWNS NOTHING: the listing is `/v1/rooms`, already ACL-filtered, and a
  room's doors are `/v1/rooms/{id}/open`.
-->
<html lang="en"><!-- replaced at boot by the active locale -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>This node · StratiGraph</title>
  <link rel="icon" href="../brand/logo/favicon-deep-charcoal.svg" type="image/svg+xml">
  <meta name="theme-color" content="#F1EBE3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2E2D2C" media="(prefers-color-scheme: dark)">
  <!-- The console's stylesheet FIRST, because it is the one that imports the
       StratiGraph theme (`../brand/…`, vendored and same-origin). One import
       chain, so the faces of this server cannot drift apart. -->
  <link rel="stylesheet" href="../admin/console.css">
  <link rel="stylesheet" href="../rooms/rooms.css">
</head>
<body>
  <header class="bar">
    <img class="mark" src="../brand/logo/favicon-deep-charcoal.svg" alt=""
         width="22" height="22">
    <span class="wordmark">StratiGraph</span>
    <span class="sub" id="app-sub">this node</span>
    <span class="grow"></span>
    <!-- The language picker, in the bar and not behind a settings screen: it is
         one touch, and each option is written IN its own language so somebody
         who cannot read the current one still finds theirs. -->
    <select id="lang" class="lang"></select>
    <span id="who" class="who"></span>
    <button id="btn-signout" class="ghost" hidden>Sign out</button>
  </header>

  <main id="main">
    <!-- ── the head: which node is this, and who am I on it ───────────────── -->
    <section class="head">
      <p id="node-line" class="node-line">…</p>
      <section id="gate" class="gate">
        <h1 id="gate-title">This node</h1>
        <p id="gate-why">Sign in to see the rooms you work in, and to open one in a tool.</p>
        <button id="btn-signin" class="primary" hidden>Sign in</button>
        <p id="gate-note" class="note"></p>
      </section>
    </section>

    <p class="note"><a class="more" href="../rooms/" id="back-door">← this node</a></p>

    <!-- ── LAVORARE · enter a room, create one, bring a file in ──────────────
         The listing arrives ALREADY ACL-filtered from `/v1/rooms`: the gate
         filters, never this page. And no empty list is ever shown for a refusal
         — «there is nothing here» would be a lie when the truth is «I do not
         know who you are». -->
    <section id="zone-rooms" class="zone" hidden>
      <h2 class="zone-title"><span id="rooms-title">Rooms</span> <span class="zone-sub" id="rooms-sub">where the work is happening now</span></h2>
      <div class="toolbar" id="create-row" hidden>
        <input id="new-room-title" type="text" placeholder="A new room's name…"
               autocomplete="off" maxlength="120">
        <button id="btn-create" class="primary">Create room</button>
        <span id="create-note" class="note"></span>
      </div>
      <div id="rooms"></div>
    </section>
  </main>

  <!-- ONE SCRIPT for the three doors. Three copies of the session, the
       token refresh and the language would be three places for the same
       bug; each zone draws only where its host element exists. -->
  <script type="module" src="../rooms/rooms.js"></script>
</body>
</html>
