<!doctype html>
<!--
  THE NODE'S FRONT DOOR — a VESTIBULE, since 6 September 2026.

  It used to do four jobs at once: what runs on this node, the rooms, the
  studies, the monuments. Whoever arrived for one walked through the other three.
  The pages now separate by VERB (design note `EM_design_aprire-entrare-creare.md`):

      consultare    the catalogue — `/catalog/ui/`, the published, citable
      lavorare      `../work/`    — enter a room, create one, bring a file in
      attrezzarsi   `../tools/`   — what runs here, and what you install
      amministrare  `../admin/`   — the console, and the map below

  …and THE DOOR STAYS ONE. Four equal pages would lose the property this page
  had won: you arrive and you understand where everything is. So it says who you
  are, how the node is, and where to go — and it SENDS: signed in, to the work;
  not signed in, to the published, because that is what a visitor can have.

  Measured before cutting anything: `/catalog/ui/` already lists the published
  studies and already has the by-HDT view. «Somewhere else has it» is the
  sentence people say about the thing that turns out to exist nowhere.

  This is the room browser (`/rooms/`) that grew a head. Before it, arriving at a
  node meant already knowing the addresses: `/em/rooms/`, `/catalog/ui/`,
  `/chat/`, `/em/admin/` — and knowing where EMStudio is downloaded. The root was
  a text sign listing routes: useful to somebody debugging, mute to somebody
  working.

  IT OWNS NOTHING. Not a list, not a state, not a configuration saying where
  things live. Every zone below is a COMPOSITION of endpoints that already
  answer:

      who you are      /v1/auth-config  + the token's claims
      this node        /v1/node         (what it offers, and where — with states)
      the rooms        /v1/rooms        (already ACL-filtered: the gate filters,
                                         never this page)
      a room's doors   /v1/rooms/{id}/open
      the studies      <catalog>/studies
      a study's doors  <catalog>/study/{id}/open
      the monuments    <catalog>/studies?view=hdt   (group_by_hdt, server-side)

  The day this page knew something nobody else confirms, it would have become the
  fifth place to keep aligned — the mistake `auth-config` and the handoff
  grammar exist to avoid.

  THREE SCOPES, ONE CARD. A monument, a study and a room are the same object at
  three distances — what endures, what was said about it, where it is being said
  now — so they share one component and differ by verb: esplora · leggi · entra.
-->
<html lang="en"><!-- replaced at boot by the active locale -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>This node · StratiGraph</title>
  <link rel="icon" href="../brand/logo/favicon-deep-charcoal.svg" type="image/svg+xml">
  <meta name="theme-color" content="#F1EBE3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2E2D2C" media="(prefers-color-scheme: dark)">
  <!-- The console's stylesheet FIRST, because it is the one that imports the
       StratiGraph theme (`../brand/…`, vendored and same-origin). One import
       chain, so the faces of this server cannot drift apart. -->
  <link rel="stylesheet" href="../admin/console.css">
  <link rel="stylesheet" href="./rooms.css">
</head>
<body>
  <header class="bar">
    <img class="mark" src="../brand/logo/favicon-deep-charcoal.svg" alt=""
         width="22" height="22">
    <span class="wordmark">StratiGraph</span>
    <span class="sub" id="app-sub">this node</span>
    <span class="grow"></span>
    <!-- The language picker, in the bar and not behind a settings screen: it is
         one touch, and each option is written IN its own language so somebody
         who cannot read the current one still finds theirs. -->
    <select id="lang" class="lang"></select>
    <span id="who" class="who"></span>
    <button id="btn-signout" class="ghost" hidden>Sign out</button>
  </header>

  <main id="main">
    <!-- ── the head: which node is this, and who am I on it ───────────────── -->
    <section class="head">
      <p id="node-line" class="node-line">…</p>
      <section id="gate" class="gate">
        <h1 id="gate-title">This node</h1>
        <p id="gate-why">Sign in to see the rooms you work in, and to open one in a tool.</p>
        <button id="btn-signin" class="primary" hidden>Sign in</button>
        <p id="gate-note" class="note"></p>
      </section>
    </section>

    <!-- ── WHERE TO GO ─────────────────────────────────────────────────────
         Composed, not owned: the catalogue's address is the NODE's own
         (`/v1/node`, `offers`) and is absent rather than guessed where no
         catalogue was published; `amministrare` appears only for whoever
         `/v1/admin/whoami` calls an operator — the same answer that gates the
         map, so the two cannot disagree about who is one. -->
    <section class="zone">
      <h2 class="zone-title" id="go-title">Where to go</h2>
      <p class="note" id="go-sub">This node, and what you came for.</p>
      <div id="destinations" class="destinations"></div>
    </section>

    <!-- ── the NODE MAP · for whoever came to make this work, not to use it ──
         Hidden by default and revealed only when `/v1/admin/whoami` answers
         `operator: true`. A visitor never sees it; the person who brought the
         stack up sees it the moment they sign in.

         SOLE READ. No verb here writes anything — no "re-run the probes", no
         "seed the demo", no "reset". This zone has to be able to exist on the
         institutional node without anybody wondering what they may press.

         And it owns NO ADDRESS: every row comes from `/v1/admin/health`, which
         is the node describing itself. Move Keycloak tomorrow and the map
         follows without this file being touched. -->
    <section id="zone-map" class="zone" hidden>
      <h2 class="zone-title"><span id="map-title">Node map</span> <span class="zone-sub" id="map-sub">where every face is, and how to ask it the same question from a terminal</span></h2>
      <p class="note" id="map-note"></p>
      <h3 class="map-head" id="map-entrances-head">This server</h3>
      <div id="map-entrances" class="map-rows"></div>
      <h3 class="map-head" id="map-neighbours-head">Around it</h3>
      <div id="map-neighbours" class="map-rows"></div>
    </section>
  </main>

  <script type="module" src="./rooms.js"></script>
</body>
</html>
